name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if source is not already present
        shell: bash
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            if [ -f MyDailyChecklist-Android-Project-FIXED.zip ]; then
              unzip -o MyDailyChecklist-Android-Project-FIXED.zip -d .
            else
              echo "Android source is missing. Upload the fixed project ZIP to the repository root, named MyDailyChecklist-Android-Project-FIXED.zip, or upload the extracted project files."
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDailyChecklist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
